- name: Check if .playbook_repos file exists
  stat:
    path: "{{ lookup('env', 'PWD') }}/.devcontainer/.playbook_repos"
  register: file_stat

- name: Clone Git Repos if file exists
  when: file_stat.stat.exists
  block:
    - name: Read repo data from .playbook_repos
      include_vars:
        file: "{{ lookup('env', 'PWD') }}/.devcontainer/.playbook_repos"
        name: repo_data

    - name: Clone Git Repositories
      git:
        repo: "{{ item.url }}"
        dest: "{{ lookup('env', 'PWD') }}/automations/{{ item.name | default(item.url | regex_replace('.*/', '') | regex_replace('\\.git$', '')) }}"
        update: yes
        accept_hostkey: yes
      loop: "{{ repo_data.repos }}"
# end block

- name: "Clone Repository {{ lookup('env', 'ANSIBLE_PLAYBOOKS_URL') }}"
  git:
    repo: "{{ lookup('env', 'ANSIBLE_PLAYBOOKS_URL') }}"
    dest: "{{ lookup('env', 'PWD') }}/automations/{{ lookup('env', 'ANSIBLE_PLAYBOOKS_URL') | regex_replace('.*/', '') | regex_replace('\\.git$', '') }}"
    update: yes
    accept_hostkey: yes
  register: repo_clone
  when: lookup('env', 'ANSIBLE_PLAYBOOKS_URL') |length > 0 and not file_stat.stat.exists
  failed_when:
    - repo_clone.failed
    - not 'Local modifications exist in repository' in repo_clone.msg
